apiVersion: apps/v1
kind: Deployment
metadata:
  name: blog-preview
  namespace: previews
  labels:
    app: blog-preview
spec:
  replicas: 1
  selector:
    matchLabels:
      app: blog-preview
  template:
    metadata:
      labels:
        app: blog-preview
    spec:
      containers:
        - name: blog-preview
          image: 192.168.1.20:5000/blog:IMAGE_TAG_PLACEHOLDER
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: blog-preview
  namespace: previews
spec:
  type: NodePort
  selector:
    app: blog-preview
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
