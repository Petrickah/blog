{{- define "main" }}
<article class="post-single contact-page">
  <header class="post-header">
    <h1 class="post-title">{{ .Title }}</h1>
  </header>

  {{- if .Content }}
  <div class="post-content md-content">
    {{ .Content }}
  </div>
  {{- end }}

  {{- with site.Params.contactEmail }}
  <p class="contact-direct"><a href="mailto:{{ . }}">{{ . }}</a></p>
  {{- end }}
</article>
{{- end }}{{/* end main */}}
