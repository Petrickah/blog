{{- define "main" }}
<article class="post-single contact-page">
  <header class="post-header">
    <h1 class="post-title">{{ .Title }}</h1>
  </header>

  {{- if .Content }}
  <div class="post-content md-content">
    {{ .Content }}
  </div>
  {{- end }}

  <div data-fs-success class="contact-notice contact-success"></div>
  <div data-fs-error class="contact-notice contact-error"></div>

  <form id="contact-form" class="contact-form">
    <div class="contact-field">
      <label for="contact-name">Name</label>
      <input type="text" id="contact-name" name="name" data-fs-field required />
      <span data-fs-error="name" class="contact-field-error"></span>
    </div>

    <div class="contact-field">
      <label for="contact-email">Email</label>
      <input type="email" id="contact-email" name="email" data-fs-field required />
      <span data-fs-error="email" class="contact-field-error"></span>
    </div>

    <div class="contact-field">
      <label for="contact-message">Message</label>
      <textarea id="contact-message" name="message" rows="6" data-fs-field required></textarea>
      <span data-fs-error="message" class="contact-field-error"></span>
    </div>

    <button type="submit" data-fs-submit-btn class="contact-submit">Send message</button>
  </form>
</article>

<script>
  window.formspree = window.formspree || function () { (formspree.q = formspree.q || []).push(arguments); };
  formspree('initForm', { formElement: '#contact-form', formId: 'xqpzvkvy' });
</script>
<script src="https://unpkg.com/@formspree/ajax@1" defer></script>
{{- end }}{{/* end main */}}
