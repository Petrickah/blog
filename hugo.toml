baseURL = 'https://petretiberiu.dev/'
locale = 'en-us'
title = 'Tiberiu Petre - Gameplay Programmer'
theme = 'PaperMod'
enableRobotsTXT = true

[outputs]
  home = ['HTML', 'RSS', 'LLMS']

[outputFormats.LLMS]
  mediaType = 'text/plain'
  baseName = 'llms'
  isPlainText = true
  notAlternative = true

[taxonomies]
  tag = 'tags'
  category = 'categories'
  series = 'series'

[params]
  defaultTheme = 'auto'
  ShowReadingTime = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowShareButtons = true
  ShowFullTextinRSS = true
  # Cloudflare Web Analytics: cookieless, so no consent banner is needed.
  # Paste the site token from Cloudflare dashboard → Web Analytics; empty = no analytics.
  cloudflareAnalyticsToken = ''
  # Contact address shown in the header next to LinkedIn/GitHub; empty = hidden.
  contactEmail = 'contact@petretiberiu.dev'
  description = 'Tiberiu Petre — Gameplay Programmer. Portfolio, projects, and technical writing.'

  [params.footer]
    text = 'Written with AI assistance — see [about](/about/).'

  [params.schema]
    publisherType = 'Person'
    sameAs = [
      'https://linkedin.com/in/tiberiupetre',
      'https://github.com/Petrickah',
      'https://tryhackme.com/p/Petrickah',
    ]

  [[params.socialIcons]]
    name = 'linkedin'
    url = 'https://linkedin.com/in/tiberiupetre'

  [[params.socialIcons]]
    name = 'github'
    url = 'https://github.com/Petrickah'

[[menu.main]]
  name = 'Home'
  url = '/'
  weight = 1

[[menu.main]]
  name = 'Blog'
  url = '/posts/'
  weight = 2

[[menu.main]]
  name = 'Categories'
  url = '/categories/'
  weight = 3

[[menu.main]]
  name = 'Projects'
  url = '/projects/'
  weight = 4

[[menu.main]]
  name = 'About'
  url = '/about/'
  weight = 5
